<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Reels rápidos: motion Planta</title>
<style>
@font-face{font-family:Outfit;src:url(../../../infoproduto/fontes/outfit-latin.woff2);font-weight:100 900}
@font-face{font-family:Figtree;src:url(../../../infoproduto/fontes/figtree-latin.woff2);font-weight:300 900}
@font-face{font-family:"IBM Plex Mono";src:url(../../../infoproduto/fontes/plex-mono-400.woff2);font-weight:400}
@font-face{font-family:"IBM Plex Mono";src:url(../../../infoproduto/fontes/plex-mono-500.woff2);font-weight:500}
:root{--paper:#f2f3f1;--surface:#fff;--ink:#121418;--ink-2:#3a3f47;--muted:#5a6069;--grid:#e3e9ee;--mark:#f4d23f;--mark-soft:#fbefb4;--planta:#c6d6e3;--planta-deep:#6f8ca5;--barro:#eeb194;--line:#c9cdc7;--bad:#c2410c;--ok:#2f7d4f;
 --f-display:Outfit,sans-serif;--f-sans:Figtree,sans-serif;--f-mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background-color:var(--paper);color:var(--ink);
 background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:70px 70px}
.abs{position:absolute}
.eyebrow{font:500 26px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.h{font:300 92px/1.02 var(--f-display);letter-spacing:-.02em}.h b{font-weight:600}
.grifo{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 6px;margin:0 -6px}
.t{font:400 40px/1.25 var(--f-sans)}.t b{font-weight:600}
.mono{font-family:var(--f-mono);font-weight:500}
.card{background:var(--surface);border:3px solid var(--ink);border-radius:22px}
.cardp{background:var(--planta);border:3px solid var(--ink);border-radius:22px}
.hachura{background-color:var(--mark-soft);background-image:repeating-linear-gradient(-45deg,var(--ink) 0 2.5px,transparent 2.5px 16px)}
.ic svg{width:100%;height:100%;display:block}
.cta{left:64px;right:64px;background:var(--mark);border:3px solid var(--ink);border-radius:20px;padding:34px 38px;font:400 54px/1.1 var(--f-display);letter-spacing:-.01em}.cta b{font-weight:600}.cta span{display:block;margin-top:16px;font:500 34px/1 var(--f-sans)}
.assina{right:64px;bottom:120px;display:flex;align-items:center;gap:14px;font:500 26px/1 var(--f-mono)}
.assina .jo{width:96px}.assina .jo svg{width:100%;height:auto}
.cota{height:3px;background:var(--ink)}.cota::before,.cota::after{content:"";position:absolute;top:-14px;width:3px;height:31px;background:var(--ink)}.cota::before{left:0}.cota::after{right:0}
.lbl{font:500 30px/1 var(--f-mono);background:var(--paper);padding:0 12px}
.item{left:64px;right:64px;display:flex;gap:26px;align-items:center;font:400 42px/1.22 var(--f-sans)}.item b{font-weight:600}
.item .ic{width:78px;height:78px;flex:none;border:3px solid var(--ink);border-radius:18px;padding:12px;background:var(--surface)}
</style></head><body>
<div id="palco"></div>
<script src="../07-rapidos/icones.js"></script>
<script src="../05-salario-imovel-canteiro/artes.js"></script>
<script>
const R0=new URLSearchParams(location.search).get("r")||"docs";const DUR={"b-sem-entrada":28,"b-nome-sujo":23.5,"b-autonomo":27,"b-cartorio":24,"b-itbi":28.5,"b-usado":24.3,"b-planta":25.8,"b-aluguel":26.5}[R0]||15;window.DUR=DUR;window.GOLPES=[];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=document.getElementById("palco");
const el=(html,css="",cls="abs")=>{const d=document.createElement("div");d.className=cls;d.style.cssText=css;d.innerHTML=html;P.appendChild(d);return d};
const entra=(e,t,a,d=.5,dy=40)=>{const p=eo(seg(t,a,a+d));e.style.opacity=p;e.style.transform=`translateY(${(1-p)*dy}px)`};
const pop=(e,t,a,d=.45)=>{const p=seg(t,a,a+d);e.style.opacity=cl(p*3);e.style.transform=`scale(${p?back(p):0})`};
const carimbar=(e,t,a,rot=-7)=>{const s=seg(t,a,a+.45);e.style.opacity=cl(s*4);e.style.transform=`rotate(${rot*s}deg) scale(${s?1.6-.6*eo(s):1.6})`};
const R=new URLSearchParams(location.search).get("r")||"docs";
const assina=el(`<div class="jo">${ARTE["joao-frente-curioso"]}</div>primeirachave.com.br`,"","abs assina");
const cta=(html,a)=>{const c=el(html,"bottom:330px","abs cta");return t=>entra(c,t,a,.6,60)};
const golpe=(...s)=>window.GOLPES.push(...s);
const fmtN=n=>Math.round(n).toLocaleString("pt-BR");
const ICB=n=>`<div class="ic" style="width:64px;height:64px;flex:none;padding:10px;border:3px solid var(--ink);border-radius:16px;background:var(--surface)">${ICONE[n]}</div>`;
let cena;

// L1: a pasta do financiamento, com caixas que vão sendo marcadas
if(R==="docs"){
 const h=el('Vai financiar? Separe <b class="grifo">estes documentos</b>.',"left:64px;top:190px;width:950px","abs h");
 const pasta=el(`<div class="abs" style="left:50%;top:-30px;transform:translateX(-50%);width:260px;height:56px;background:var(--ink);border-radius:14px"></div>
  <div class="mono" style="font-size:26px;letter-spacing:.07em;color:var(--ink-2);margin-top:20px">PASTA DO FINANCIAMENTO</div>`,
  "left:64px;right:64px;top:560px;height:800px;padding:36px 44px","abs card");
 const linhas=[["RG, CPF e <b>certidão de estado civil</b>","nascimento ou casamento"],["<b>Comprovante de renda</b>","holerites, ou 6 meses de extrato + IR"],["<b>Comprovante de residência</b>","atual"],["<b>Extrato do FGTS</b>","se for usar"]]
  .map((x,i)=>el(`<div class="box" style="width:62px;height:62px;flex:none;border:3px solid var(--ink);border-radius:12px;background:var(--paper);position:relative"><div class="ic ok abs" style="left:4px;top:4px;width:48px;height:48px">${ICONE.ok}</div></div>
   <div><div style="font:400 40px/1.2 var(--f-sans)">${x[0]}</div><div style="font:400 29px/1.2 var(--f-sans);color:var(--muted);margin-top:6px">${x[1]}</div></div>`,
   `left:108px;right:108px;top:${680+i*150}px;display:flex;gap:28px;align-items:center`,"abs"));
 const nota=el("Cada banco pode pedir algo a mais.","left:108px;top:1290px;font:400 28px/1.2 var(--f-sans);color:var(--muted)","abs");
 const selo=el("pasta<br>pronta","right:110px;top:1120px;border:5px solid var(--ink);border-radius:14px;padding:14px 22px;font:600 44px/1.02 var(--f-display);text-transform:uppercase;background:rgba(251,239,180,.95);transform-origin:center","abs");
 const T=[1.8,3.2,4.6,6.0],K=T.map(v=>v+.7);
 const c=cta("<b>Salve</b> para não esquecer nenhum.<span>Link na bio.</span>",11.4);
 golpe(...K,8.4,11.4);
 cena=t=>{entra(h,t,.1,.6);entra(pasta,t,.9,.6,60);
  linhas.forEach((e,i)=>{entra(e,t,T[i]);const k=e.querySelector(".ok");const p=seg(t,K[i],K[i]+.3);k.style.opacity=p;k.style.transform=`scale(${p?back(p):0})`;
   e.querySelector(".box").style.background=t>K[i]?"var(--mark)":"var(--paper)"});
  entra(nota,t,7.2);carimbar(selo,t,8.4);c(t)}
}

// L2: o recibo que vai sendo impresso
if(R==="custos"){
 const eb=el("Imóvel de R$ 200 mil · São Paulo","left:64px;top:190px","abs eyebrow");
 const h=el('Além da entrada, <b class="grifo">quanto sai</b> do bolso?',"left:64px;top:240px;width:950px","abs h");
 const itens=[["Imposto da prefeitura (ITBI)","3% · varia por cidade","6.000"],["Registro no cartório","já com o desconto de 1º imóvel","2.200"],["Avaliação do banco","taxa da vistoria","1.000"]];
 const rec=el(`<div style="text-align:center" class="mono"><div style="font-size:26px;letter-spacing:.1em">CUSTOS DA COMPRA</div><div style="font-size:22px;color:var(--muted);margin-top:8px">além da entrada</div></div>
  <div style="border-top:3px dashed var(--ink);margin:30px 0 10px"></div>
  ${itens.map(x=>`<div class="lin" style="display:flex;justify-content:space-between;align-items:flex-end;padding:22px 0;border-bottom:2px dashed var(--line)"><div><div style="font:500 36px/1.15 var(--f-sans)">${x[0]}</div><div style="font:400 26px/1.2 var(--f-sans);color:var(--muted);margin-top:6px">${x[1]}</div></div><div class="mono" style="font-size:40px;white-space:nowrap">≈ ${x[2]}</div></div>`).join("")}
  <div class="tot" style="display:flex;justify-content:space-between;align-items:center;margin-top:30px"><div class="mono" style="font-size:34px;letter-spacing:.06em">TOTAL</div><div class="mono" style="font-size:64px;background:var(--mark);padding:2px 16px;border-radius:10px">≈ R$ <span id="tot">0</span> mil</div></div>
  <div class="mono fora" style="margin-top:26px;font-size:24px;color:var(--ink-2);text-align:center">NADA DISSO ENTRA NO FINANCIAMENTO</div>`,
  "left:100px;right:100px;top:560px;padding:40px 46px 44px;background:var(--surface);border:3px solid var(--ink);border-radius:8px 8px 0 0;clip-path:inset(0 0 100% 0)","abs");
 const nota=el("Estimativa do simulador: financiando R$ 160 mil, ITBI de 3%.","left:64px;right:64px;top:1340px;font:400 24px/1.3 var(--f-sans);color:var(--muted)","abs");
 const c=cta("E no <b>seu</b> caso?<span>Descubra no link da bio.</span>",11.6);
 const L=[2.6,4.0,5.4];golpe(...L,7.2,9.0,11.6);
 cena=t=>{entra(eb,t,.1);entra(h,t,.3,.6);
  // o recibo sai da impressora de cima para baixo
  const imp=eio(seg(t,1.4,7.4));rec.style.clipPath=`inset(0 0 ${100-100*imp}% 0)`;
  rec.querySelectorAll(".lin").forEach((e,i)=>{const p=eo(seg(t,L[i],L[i]+.4));e.style.opacity=p});
  const tp=eo(seg(t,7.2,8.2));rec.querySelector(".tot").style.opacity=cl(seg(t,7.2,7.5));document.getElementById("tot").textContent=Math.round(9*tp);
  rec.querySelector(".fora").style.opacity=cl(seg(t,9,9.4));entra(nota,t,9.6);c(t);nota.style.opacity=Math.min(nota.style.opacity,1-seg(t,11.2,11.6))}
}

// L3: medidor "pronto para visitar" que enche a cada passo
if(R==="visita"){
 const h=el('<b class="grifo">Antes de visitar</b> o primeiro imóvel:',"left:64px;top:190px;width:950px","abs h");
 const med=el(`<div class="eyebrow" style="margin-bottom:18px">Pronto para visitar</div>
  <div style="position:relative;height:70px;border:3px solid var(--ink);border-radius:14px;background:var(--surface);overflow:hidden"><div id="enche" class="hachura abs" style="left:0;top:0;bottom:0;width:0"></div>
  ${[1,2,3].map(k=>`<div class="abs" style="left:${k*25}%;top:0;bottom:0;width:3px;background:var(--ink)"></div>`).join("")}</div>
  <div class="mono abs" id="pct" style="right:0;top:-6px;font-size:34px;padding:4px 12px;border-radius:8px">0%</div>`,
  "left:64px;right:64px;top:520px","abs");
 const li=[["calculadora","Saiba <b>quanto o banco te empresta</b>"],["cpf","Veja o seu nome no <b>Registrato</b>"],["cofre","Separe <b>uns 5%</b> para imposto e cartório"],["documento","Junte os <b>documentos de renda</b>"]]
  .map((x,i)=>el(`<div class="ic">${ICONE[x[0]]}</div><div>${x[1]}</div><div class="ic ok" style="width:56px;height:56px;border:none;padding:0;background:none;margin-left:auto">${ICONE.ok}</div>`,`top:${720+i*150}px`,"abs item"));
 const casa=el(`${ICB("casa")}<div style="font:600 38px/1.15 var(--f-display)">Agora sim: visite com o seu número na mão.</div>`,"left:64px;right:64px;top:1330px;display:flex;gap:22px;align-items:center;background:var(--mark-soft);border:3px solid var(--ink);border-radius:18px;padding:20px 26px","abs");
 const T=[1.8,3.4,5.0,6.6];golpe(...T.map(v=>v+.6),8.4,11.8);
 const c=cta("<b>Salve</b> antes da primeira visita.<span>Descubra o seu número no link da bio.</span>",11.8);
 cena=t=>{entra(h,t,.1,.6);entra(med,t,.8);
  let f=0;T.forEach((a,i)=>{f+=.25*eio(seg(t,a+.6,a+1.1))});document.getElementById("enche").style.width=f*100+"%";
  const pc=document.getElementById("pct");pc.textContent=Math.round(f*100)+"%";pc.style.background=f>.99?"var(--mark)":"transparent";
  li.forEach((e,i)=>{entra(e,t,T[i]);const k=e.querySelector(".ok");k.style.opacity=seg(t,T[i]+.6,T[i]+.9)});
  entra(casa,t,8.4,.6);casa.style.opacity=Math.min(casa.style.opacity,1-seg(t,11.3,11.8));c(t)}
}

// L4: a conversa com o vendedor, em balões
if(R==="perguntas"){
 const h=el('<b class="grifo">4 perguntas</b> antes de fechar o imóvel.',"left:64px;top:190px;width:950px","abs h");
 const pares=[["A matrícula está no nome de quem vende?","confira no cartório antes do sinal"],["Tem IPTU ou condomínio atrasado?","a dívida pode passar para você"],["A reforma está na matrícula?","se não estiver, a avaliação pode travar"],["Aceita esperar o banco aprovar?","combine isso no contrato"]];
 const Y=[480,690,900,1110];
 const bal=pares.map((x,i)=>[
  el(`<div style="font:500 38px/1.2 var(--f-sans)">${x[0]}</div>`,`right:64px;top:${Y[i]}px;max-width:820px;background:var(--mark);border:3px solid var(--ink);border-radius:26px 26px 6px 26px;padding:22px 28px;transform-origin:right bottom`,"abs"),
  el(`<span class="mono" style="font-size:24px;color:var(--muted);margin-right:10px">POR QUÊ</span>${x[1]}`,`left:64px;top:${Y[i]+108}px;max-width:820px;background:var(--surface);border:3px solid var(--ink);border-radius:26px 26px 26px 6px;padding:16px 24px;font:400 30px/1.2 var(--f-sans);transform-origin:left top`,"abs")]);
 const T=[1.6,3.8,6.0,8.2];golpe(...T,...T.map(v=>v+.9),11.6);
 const c=cta("<b>Salve</b> para a próxima visita.<span>Mais no link da bio.</span>",11.6);
 cena=t=>{entra(h,t,.1,.6);bal.forEach((b,i)=>{pop(b[0],t,T[i],.4);pop(b[1],t,T[i]+.9,.4);
  if(i===3){const s=seg(t,11.1,11.6);b[1].style.opacity=Math.min(b[1].style.opacity,1-s)}});c(t)}
}

// L5: as 4 chaves que precisam estar ligadas para usar o FGTS
if(R==="fgts"){
 const h=el('Quer usar o <b class="grifo">FGTS</b> no imóvel?',"left:64px;top:190px;width:950px","abs h");
 const sub=el("Confira as 4 regras:","left:64px;top:420px;font:600 40px/1 var(--f-sans)","abs");
 const regras=[["3 anos de carteira assinada","pode somar empregos"],["Sem imóvel na sua cidade","onde mora ou trabalha"],["Sem outro financiamento","da casa própria, ativo"],["Imóvel para você morar","residencial"]];
 const sw=regras.map((x,i)=>el(`<div><div style="font:600 38px/1.15 var(--f-sans)">${x[0]}</div><div style="font:400 28px/1.2 var(--f-sans);color:var(--muted);margin-top:6px">${x[1]}</div></div>
  <div class="trilho" style="margin-left:auto;flex:none;width:132px;height:68px;border:3px solid var(--ink);border-radius:40px;background:var(--paper);position:relative"><div class="bola abs" style="left:6px;top:6px;width:50px;height:50px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)"></div></div>`,
  `left:64px;right:64px;top:${510+i*170}px;height:148px;display:flex;align-items:center;gap:24px;padding:0 30px`,"abs card"));
 const fim=el(`${ICB("cofre")}<div style="font:600 38px/1.15 var(--f-display)">Cumpriu as 4? O FGTS pode entrar na entrada.</div>`,"left:64px;right:64px;top:1220px;display:flex;gap:22px;align-items:center;background:var(--mark-soft);border:3px solid var(--ink);border-radius:18px;padding:20px 26px","abs");
 const T=[1.6,3.2,4.8,6.4],L=T.map(v=>v+.8);golpe(...L,8.6,11.8);
 const c=cta("<b>Salve</b> para conferir depois.<span>Mais no link da bio.</span>",11.8);
 cena=t=>{entra(h,t,.1,.6);entra(sub,t,.8);
  sw.forEach((e,i)=>{entra(e,t,T[i]);const p=eio(seg(t,L[i],L[i]+.3));e.querySelector(".bola").style.left=(6+64*p)+"px";e.querySelector(".trilho").style.background=p>.5?"var(--mark)":"var(--paper)"});
  entra(fim,t,8.6,.6);fim.style.opacity=Math.min(fim.style.opacity,1-seg(t,11.3,11.8));c(t)}
}
// Busca #2, narrado: preço x avaliação
if(R==="b-sem-entrada"){
 const h=el('Dá pra comprar casa <b class="grifo">sem entrada</b>?',"left:64px;top:190px;width:950px","abs h");
 const selo=el("Dá, num caso.","right:64px;top:420px;border:5px solid var(--ink);border-radius:14px;padding:12px 22px;font:600 46px/1 var(--f-display);text-transform:uppercase;background:var(--mark);transform-origin:center","abs");
 const regra=el('O banco empresta até <b>80% da avaliação</b>,<br>não do preço.',"left:64px;top:540px;font:400 44px/1.25 var(--f-sans)","abs");
 const W=952;
 const barra=(rot,val,top,frac,id)=>el(`<div style="display:flex;justify-content:space-between;align-items:baseline"><div class="eyebrow">${rot}</div><div class="mono" style="font-size:44px">R$ ${val} mil</div></div>
  <div style="position:relative;margin-top:14px;height:84px"><div id="${id}" class="abs" style="left:0;top:0;bottom:0;width:0;border:3px solid var(--ink);border-radius:14px;background:var(--planta)"></div></div>`,`left:64px;top:${top}px;width:${W*frac}px`,"abs");
 const bp=barra("Preço do imóvel","200",720,.8,"bp"),ba=barra("Avaliação do banco","250",900,1,"ba");
 const oit=el(`<div class="hachura" style="position:absolute;inset:0;border-radius:11px"></div>`,`left:67px;top:${900+58+14+3}px;height:78px;width:0;border-radius:11px;overflow:hidden`,"abs");
 const cota=el(`<div class="abs cota" style="left:0;right:0;top:18px"></div><div class="abs lbl" style="top:2px;left:50%;transform:translateX(-50%);white-space:nowrap">80% = R$ 200 mil</div>`,`left:64px;top:1080px;width:${W*.8}px;height:40px`,"abs");
 const ent=el(`<div class="eyebrow">Entrada</div><div class="mono" style="font-size:96px;margin-top:6px"><span style="background:var(--mark);padding:0 16px;border-radius:12px;margin-left:-4px">R$ 0</span></div>`,"left:64px;top:1150px","abs");
 const al=el(`<div class="ic">${ICONE.alerta}</div><div>Cartório e imposto: <b>por sua conta</b>.</div>`,"top:1180px;left:470px;right:64px;font-size:38px","abs item");
 const c=cta("E no <b>seu</b> caso?<span>Descubra no link da bio.</span>",24.5);
 golpe(2.6,10.3,13.1,15.2,19.06,20.9,24.5);
 cena=t=>{entra(h,t,0,.5);carimbar(selo,t,2.6,-5);entra(regra,t,4.85,.6);
  entra(bp,t,10.1);document.getElementById("bp").style.width=100*eo(seg(t,10.3,11.2))+"%";
  entra(ba,t,12.9);document.getElementById("ba").style.width=100*eo(seg(t,13.1,14.2))+"%";
  oit.style.width=W*.8*eio(seg(t,15.2,16.6))-6+"px";oit.style.opacity=t>15.2?1:0;
  entra(cota,t,16.6,.4,20);pop(ent,t,19.06,.45);entra(al,t,20.9,.5);
  const s=seg(t,24.1,24.5);[ent,al].forEach(e=>e.style.opacity=Math.min(e.style.opacity,1-s));c(t)}
}
// helpers dos Reels narrados
const SELO=(txt,css)=>el(txt,`${css};border:5px solid var(--ink);border-radius:14px;padding:12px 22px;font:600 46px/1 var(--f-display);text-transform:uppercase;background:var(--mark);transform-origin:center`,"abs");
const LINHA=(icone,html,top,css="")=>el(`<div class="ic">${ICONE[icone]}</div><div>${html}</div>`,`top:${top}px;${css}`,"abs item");
const PILL=(txt,cor)=>`<span class="mono" style="font-size:26px;padding:8px 14px;border-radius:10px;border:3px solid var(--ink);background:${cor};color:${cor==="var(--bad)"||cor==="var(--ok)"?"#fff":"var(--ink)"}">${txt}</span>`;
const some=(lista,t,a)=>{const s=seg(t,a-.4,a);lista.forEach(e=>e.style.opacity=Math.min(e.style.opacity===""?1:+e.style.opacity,1-s))};

// Busca #1: nome sujo
if(R==="b-nome-sujo"){
