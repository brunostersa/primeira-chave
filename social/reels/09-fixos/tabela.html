<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Reel fixo: tabela</title>
<style>
@font-face{font-family:Outfit;src:url(../../../infoproduto/fontes/outfit-latin.woff2);font-weight:100 900}
@font-face{font-family:Figtree;src:url(../../../infoproduto/fontes/figtree-latin.woff2);font-weight:300 900}
@font-face{font-family:"IBM Plex Mono";src:url(../../../infoproduto/fontes/plex-mono-400.woff2);font-weight:400}
@font-face{font-family:"IBM Plex Mono";src:url(../../../infoproduto/fontes/plex-mono-500.woff2);font-weight:500}
:root{--paper:#f2f3f1;--surface:#fff;--ink:#121418;--ink-2:#3a3f47;--muted:#5a6069;--grid:#e3e9ee;--mark:#f4d23f;--planta:#c6d6e3;--planta-deep:#6f8ca5;--barro:#eeb194;--line:#c9cdc7;--f-display:Outfit,sans-serif;--f-sans:Figtree,sans-serif;--f-mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#cartao{position:absolute;left:96px;right:96px;top:300px;border:3px solid var(--ink);border-radius:20px;padding:48px 38px 36px;color:var(--ink);
 background-color:rgba(242,243,241,.85);background-image:linear-gradient(rgba(198,214,227,.35) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(198,214,227,.35) 1.5px,transparent 1.5px);background-size:40px 40px}
h1{font:300 68px/1 var(--f-display);letter-spacing:-.02em;margin-bottom:14px}.sub{font:400 27px/1.2 var(--f-sans);color:var(--ink-2);margin-bottom:30px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--f-mono)}
th{font:500 19px/1.15 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 14px;vertical-align:bottom}
td{font:500 36px/1 var(--f-mono);padding:19px 0;border-top:2px solid var(--ink);white-space:nowrap}
td.pc span{background:var(--mark);padding:4px 10px;border-radius:8px;margin-left:-10px}

.extra{margin-top:22px;padding-top:20px;border-top:3px solid var(--ink);font:400 29px/1.3 var(--f-sans);color:var(--ink-2)}.extra b{font-weight:600;color:var(--ink)}
.url{position:absolute;right:34px;top:20px;font:500 22px/1 var(--f-mono);color:var(--ink-2)}.av{margin-top:12px;font:400 21px/1.35 var(--f-sans);color:var(--muted)}
#salve{position:absolute;left:96px;top:1392px;display:flex;align-items:center;gap:18px}
#salve .s{background:var(--mark);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:20px 26px;font:400 38px/1.12 var(--f-display);letter-spacing:-.01em}#salve .s b{font-weight:600}#salve .s span{display:block;margin-top:10px;font:500 26px/1 var(--f-sans)}
#salve .u{font:500 28px/1 var(--f-mono);color:var(--ink);background:rgba(242,243,241,.95);border:3px solid var(--ink);border-radius:12px;padding:18px 20px}
#jo{position:absolute;right:110px;top:215px;width:160px}#jo svg{width:100%;height:auto}
</style></head><body>
<div id="cartao">
  <h1 id="h"></h1><div class="sub">Salve para consultar na hora de comprar.</div>
  <table><thead><tr id="cab"></tr></thead><tbody id="linhas"></tbody></table>
  <div class="extra" id="extra"></div>
  <div class="av" id="av"></div>
  <div class="url">primeirachave.com.br</div>
</div>
<div id="salve"><div class="s" id="cta"></div></div>
<div id="jo"></div>
<script src="../05-salario-imovel-canteiro/artes.js"></script>
<script>
// Números do motor (src/lib/financiamento/engine.ts, 26/11/2026): idade 30, sem dívidas, sem FGTS, 35 anos, tabela Price.
const T={
 salario:{h:'Qual imóvel cabe<br>no seu salário?',cab:['Renda<br>R$','Imóvel até<br>R$','Parcela<br>R$'],dest:1,
  L:[["2.000","137 mil","600"],["3.000","209 mil","900"],["4.000","210 mil*","1.129"],["6.000","300 mil","1.800"],["8.000","400 mil","2.394"]],
  extra:'Parcela até <b>30% da renda</b>, entrada de <b>20%</b>.',av:'*Teto do Minha Casa Minha Vida nessa faixa; varia por cidade. Estimativa, não é aprovação.',
  cta:'E com o <b>seu</b> salário?<span>Descubra no link da bio.</span>'},
 namao:{h:'Quanto ter<br>na mão?',cab:['Imóvel<br>R$','Entrada<br>R$','ITBI e<br>cartório R$','Total<br>R$'],dest:3,
  L:[["150 mil","30 mil","7,5 mil","37,5 mil"],["200 mil","40 mil","10 mil","50 mil"],["250 mil","50 mil","12,5 mil","62,5 mil"],["300 mil","60 mil","15 mil","75 mil"],["400 mil","80 mil","20 mil","100 mil"]],
  extra:'Entrada de <b>20%</b> + uns <b>5%</b> de ITBI e cartório.',av:'O ITBI muda por cidade. Estimativa, não é aprovação.',
  cta:'Dá pra pagar <b>menos</b> de entrada?<span>Veja no link da bio.</span>'},
};
const t=T[new URLSearchParams(location.search).get("r")||"salario"];
document.getElementById('h').innerHTML=t.h;
document.getElementById('cab').innerHTML=t.cab.map(c=>`<th>${c}</th>`).join('');
document.getElementById('linhas').innerHTML=t.L.map(r=>`<tr>${r.map((c,i)=>i===t.dest?`<td class="pc"><span>${c}</span></td>`:`<td>${c}</td>`).join('')}</tr>`).join('');
document.getElementById('extra').innerHTML=t.extra;document.getElementById('av').innerHTML=t.av;document.getElementById('cta').innerHTML=t.cta;

if(t.cab.length>3)document.querySelectorAll('td').forEach(td=>td.style.fontSize='32px');
const cb=document.getElementById('cartao').getBoundingClientRect();document.getElementById('salve').style.top=(cb.bottom+28)+'px';
</script></body></html>
