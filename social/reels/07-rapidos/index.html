<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Reels rápidos: camada fixa</title>
<style>
@font-face{font-family:Outfit;src:url(../../../infoproduto/fontes/outfit-latin.woff2);font-weight:100 900}
@font-face{font-family:Figtree;src:url(../../../infoproduto/fontes/figtree-latin.woff2);font-weight:300 900}
@font-face{font-family:"IBM Plex Mono";src:url(../../../infoproduto/fontes/plex-mono-500.woff2);font-weight:500}
:root{--paper:#f2f3f1;--surface:#fff;--ink:#121418;--ink-2:#3a3f47;--muted:#5a6069;--mark:#f4d23f;--barro:#eeb194;--f-display:Outfit,sans-serif;--f-sans:Figtree,sans-serif;--f-mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#topo{position:absolute;left:48px;right:48px;top:150px;font:600 34px/1.2 var(--f-sans);color:var(--ink);background:var(--mark);border:3px solid var(--ink);border-radius:14px;padding:18px 26px;display:none}
#cartao{position:absolute;left:48px;right:48px;top:220px;border:3px solid var(--ink);border-radius:20px;padding:56px 44px 44px;color:var(--ink);
 background-color:rgba(242,243,241,.85);background-image:linear-gradient(rgba(198,214,227,.35) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(198,214,227,.35) 1.5px,transparent 1.5px);background-size:40px 40px}
h1{font:300 76px/1.04 var(--f-display);letter-spacing:-.02em;margin-bottom:22px;padding-right:180px}h1 b{font-weight:600}
.sub{font:400 32px/1.25 var(--f-sans);color:var(--ink-2);margin-bottom:26px}
.nums{display:flex;gap:20px;margin:6px 0 30px}.num{flex:1;border-top:3px solid var(--ink);padding-top:16px}
.num small{display:block;font:500 22px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.num strong{font:500 60px/1 var(--f-mono)}.num.am strong{background:var(--mark);padding:2px 10px;border-radius:8px;margin-left:-10px}
ol{list-style:none;counter-reset:i}li{counter-increment:i;display:flex;gap:22px;align-items:baseline;font:400 37px/1.25 var(--f-sans);padding:22px 0;border-top:2px solid var(--ink)}
li::before{content:counter(i);font:500 30px/1 var(--f-mono);min-width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;transform:translateY(4px)}
li b{font-weight:600}
.av{margin-top:22px;font:400 24px/1.35 var(--f-sans);color:var(--muted)}
.url{position:absolute;right:40px;bottom:-56px;font:500 26px/1 var(--f-mono);color:var(--ink);background:rgba(242,243,241,.95);border:3px solid var(--ink);border-radius:10px;padding:10px 14px}
#salve{position:absolute;left:48px;right:48px;display:flex}
#salve .s{background:var(--mark);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:26px 30px;font:400 44px/1.12 var(--f-display);letter-spacing:-.01em}#salve .s b{font-weight:600}#salve .s span{display:block;margin-top:12px;font:500 30px/1 var(--f-sans)}
#jo{position:absolute;right:58px;top:120px;width:200px}#jo svg{width:100%;height:auto}
</style></head><body>
<div id="topo"></div>
<div id="cartao"></div>
<div id="salve"><div class="s"></div></div>
<div id="jo"></div>
<script src="../05-salario-imovel-canteiro/artes.js"></script>
<script>
// Um Reel por chave (?r=cartorio|35anos|simulacao|trava). Números do motor (src/lib/financiamento/engine.ts, calcular, 10/11/2026):
// imóvel R$ 200 mil, entrada R$ 40 mil, renda R$ 2.880, 30 anos, sem FGTS, MCMV 5% a.a., Price 420 meses: financiado R$ 160.000, total pago R$ 359.699.
const R={
 cartorio:{jo:"joao-chave-feliz",
  h:"Primeiro imóvel financiado? O cartório tem <b>50% de desconto</b>.",
  li:["É lei federal: Lei 6.015/73, art. 290.","Vale na <b>1ª compra residencial</b> financiada pelo SFH.","Confira na guia do cartório se o desconto veio.","O <b>ITBI</b> é da prefeitura: depende da sua cidade."],
  cta:"<b>Salve</b> para quando<br>for assinar.<span>Mais no link da bio.</span>"},
 "35anos":{jo:"joao-frente-curioso",
  h:"Você não precisa levar <b>35 anos</b> para quitar.",
  nums:[["Pegou","160 mil"],["Paga em 35 anos","360 mil",1]],
  li:["Todo valor extra abate o saldo e <b>corta juros</b>.","Dá para usar o <b>FGTS</b> para amortizar a cada 2 anos.","Na hora de amortizar, escolha <b>reduzir o prazo</b>."],
  av:"Estimativa: imóvel de R$ 200 mil, entrada de R$ 40 mil, Minha Casa Minha Vida, tabela Price. Valores em R$, com seguros.",
  cta:"Quanto fica a <b>sua</b> parcela?<span>Simule no link da bio.</span>"},
 simulacao:{jo:"joao-frente-pensativo",topo:"Envie para quem vai comprar o primeiro imóvel.",
  h:"A simulação <b>não aprova</b> ninguém.",sub:"O que o banco olha de verdade:",
  li:["Renda comprovada: a parcela vai até <b>30%</b> dela.","Nome e dívidas no <b>Registrato</b>.","Avaliação do imóvel: o banco empresta sobre o <b>laudo</b>.","Documentos do imóvel e do vendedor."],
  cta:"Descubra o <b>seu número</b><br>antes de visitar.<span>Link na bio.</span>"},
 trava:{jo:"joao-frente-pensativo",
  h:"4 coisas que <b>travam</b> o financiamento no meio do caminho.",
  li:["Fazer <b>dívida nova</b> durante a análise.","<b>Trocar de emprego</b> antes de assinar.","Pagar o sinal sem cláusula para <b>crédito negado</b>.","Imóvel com obra que <b>não está na matrícula</b>."],
  cta:"<b>Salve</b> antes de começar.<span>Mais no link da bio.</span>"}
};
const k=new URLSearchParams(location.search).get("r")||"cartorio",d=R[k];
let h=`<h1>${d.h}</h1>`;if(d.sub)h+=`<div class="sub">${d.sub}</div>`;
if(d.nums)h+=`<div class="nums">${d.nums.map(n=>`<div class="num${n[2]?" am":""}"><small>${n[0]} R$</small><strong>${n[1]}</strong></div>`).join("")}</div>`;
h+=`<ol>${d.li.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>`;if(d.av)h+=`<div class="av">${d.av}</div>`;h+=`<div class="url">primeirachave.com.br</div>`;
document.getElementById("cartao").innerHTML=h;
if(d.topo){const t=document.getElementById("topo");t.textContent=d.topo;t.style.display="block";document.getElementById("cartao").style.top="260px";document.getElementById("jo").style.top="200px"}
document.querySelector("#salve .s").innerHTML=d.cta;
document.getElementById("jo").innerHTML=ARTE[d.jo];
// CTA logo abaixo do cartão, sem passar de 1500 (área segura acima da legenda do Reels).
const c=document.getElementById("cartao").getBoundingClientRect();document.getElementById("salve").style.top=Math.min(c.bottom+96,1500)+"px";
</script>
</body></html>
