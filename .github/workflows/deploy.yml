# Publica o site na Hostinger a cada push na main: testa, gera o estático (out/) e envia por FTP.
# Segredos (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD e FTP_DIR (pasta do site, terminando em /).
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # o primeiro envio leva todos os arquivos; os seguintes, só o que mudou
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o sitemap usa a data do último commit de cada página

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Conferir segredos do FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Segredos do FTP ainda não configurados: build ok, nada foi publicado."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      # lftp em paralelo e só o que mudou: scripts/deploy-ftp.mjs (manifesto com sha256 no servidor).
      # A action anterior enviava um arquivo por vez e levava muitos minutos quando o layout mudava.
      - name: Instalar lftp
        if: steps.ftp.outputs.pronto == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar out/ por FTP
        if: steps.ftp.outputs.pronto == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: node scripts/deploy-ftp.mjs
